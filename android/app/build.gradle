plugins { id 'com.android.application' }
android {
    namespace 'com.tengzikeji.dagongren'
    compileSdk 35
    defaultConfig {
        applicationId 'com.tengzikeji.dagongren.upgrade'
        minSdk 26
        targetSdk 35
        versionCode 29
        versionName '1.3.5-beta.5'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    signingConfigs {
        debug {
            storeFile rootProject.file('../signing-key/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes { release { minifyEnabled false; debuggable false; jniDebuggable false; signingConfig signingConfigs.debug } }
    testBuildType "release"
    lint { abortOnError true }
}
tasks.register('syncWebAssets', Sync) {
    from '../../dist'
    into 'src/main/assets/www'
}
tasks.named('preBuild').configure { dependsOn 'syncWebAssets' }
dependencies {
    implementation 'androidx.webkit:webkit:1.14.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.3.0'
}
